<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>ArchiveCore - brak połączenia</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f9fafb; color: #111827; font: 16px system-ui, sans-serif; }
      main { max-width: 29rem; margin: 1rem; padding: 2rem; border: 1px solid #e5e7eb; border-radius: 1rem; background: white; box-shadow: 0 8px 24px #1118270d; }
      h1 { margin: 0 0 1rem; font-size: 1.5rem; }
      p { line-height: 1.55; color: #4b5563; }
      button { margin-top: 1rem; border: 0; border-radius: .5rem; padding: .75rem 1rem; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      small { display: block; margin-top: 1.5rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak połączenia z ArchiveCore</h1>
      <p>Sprawdź połączenie i spróbuj ponownie. Przyjęcia, wydania, przeniesienia i inwentaryzacja wymagają dostępu do serwera. Operacje nie są zapisywane offline.</p>
      <form method="get"><button type="submit">Spróbuj ponownie</button></form>
      <small>Offline: ArchiveCore requires a connection to save warehouse operations.</small>
    </main>
  </body>
</html>
