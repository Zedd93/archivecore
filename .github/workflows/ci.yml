name: ArchiveCore CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: archivecore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Verify billing export
        run: npm run test:billing-export

      - name: Verify monthly client report
        run: npm run test:monthly-report

      - name: Verify transfer list column mapping
        run: npm run test:transfer-list-mapping

      - name: Verify box and personnel column mapping
        run: npm run test:table-import-mapping

      - name: Verify scan import approval
        run: npm run test:scan-import

      - name: Verify offline PWA fallback
        run: npm run test:offline-shell

      - name: Verify search-to-order selection
        run: npm run test:order-draft

      - name: Verify offline warehouse scan drafts
        run: npm run test:offline-warehouse-scans

      - name: Verify resumable warehouse submissions
        run: npm run test:warehouse-submission

      - name: Verify warehouse operation idempotency
        run: npm run test:warehouse-idempotency

      - name: Verify legal hold and disposal safeguards
        run: npm run test:legal-hold

      - name: Verify disposal photo evidence
        run: npm run test:disposal-evidence

      - name: Verify handover photo evidence
        run: npm run test:order-handover-photos

      - name: Verify scan-on-demand orders
        run: npm run test:order-scans

      - name: Verify location capacity suggestions
        run: npm run test:location-capacity

      - name: Verify archive health checks
        run: npm run test:storage-health

      - name: Verify partner API access
        run: npm run test:integrations

      - name: Verify order webhooks
        run: npm run test:webhooks

      - name: Verify personnel record retention dates
        run: npm run test:hr-retention

      - name: Verify invoice confirmation
        run: npm run test:billing-invoice

      - name: Verify billing repricing
        run: npm run test:billing-repricing

      - name: Verify monthly billing close
        run: npm run test:billing-close

      - name: Verify read-only billing audit
        run: npm run test:billing-amount-audit

      - name: Verify QR formats
        run: npm run test:qr

      - name: Verify order picking
        run: npm run test:order-picking

      - name: Verify loan returns
        run: npm run test:loan-return

      - name: Verify historical box loan audit
        run: npm run test:box-loan-audit

      - name: Verify inventory checks
        run: npm run test:inventory

      - name: Verify saved inventory sessions
        run: npm run test:inventory-sessions

      - name: Verify QR warehouse receiving
        run: npm run test:warehouse-receive

      - name: Verify box movement custody
        run: npm run test:box-movement

      - name: Verify warehouse worklist
        run: npm run test:warehouse-home
